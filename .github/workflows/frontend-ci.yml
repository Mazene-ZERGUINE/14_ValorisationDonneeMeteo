name: Frontend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  IMAGE_NAME: 14_valorisationdonneemeteo-frontend

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      COVERAGE_THRESHOLD: "25"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3

      - name: Install npm dependencies
        run: npm clean-install

      - name: Build the back-end image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: meteo-backend:ci
          load: true
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Start the back-end
        run: |
          docker run -d --name meteo-backend -p 8000:8000 \
            -e SECRET_KEY=django-insecure-ci-secret \
            -e DEBUG=false \
            -e ALLOWED_HOSTS='*' \
            -e MOCKED_DATA=true \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            meteo-backend:ci

      - name: Run linter
        run: npm run lint

      - name: Test build
        run: npm run build

      - name: Wait for the back-end to be ready
        id: wait-backend
        run: timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:8000/api/schema/; do sleep 2; done'

      - name: Run tests (unit + integration) with coverage
        id: tests
        run: npm run test:ci:coverage
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1


      - name: Publish coverage to the job summary
        run: node "$GITHUB_WORKSPACE/.github/workflows/scripts/frontend-coverage-summary.cjs"

      - name: Stop the back-end
        run: docker rm -f meteo-backend

  docker-push:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    env:
      PUSH_IMAGE: ${{  github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and push on main) the Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          context: ./frontend
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          push: ${{ env.PUSH_IMAGE == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
