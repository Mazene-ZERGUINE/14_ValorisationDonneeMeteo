name: Frontend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  IMAGE_NAME: 14_valorisationdonneemeteo-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm clean-install

      - name: Run linter
        run: npm run lint

      - name: Test build
        run: npm run build

  run-tests:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm clean-install

      - name: Build the back-end image
        working-directory: .
        run: docker build -t meteo-backend:ci ./backend

      - name: Start the back-end
        working-directory: .
        run: |
          docker run -d --name meteo-backend -p 8000:8000 \
            -e SECRET_KEY=django-insecure-ci-secret \
            -e DEBUG=false \
            -e ALLOWED_HOSTS='*' \
            -e MOCKED_DATA=true \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            meteo-backend:ci

      - name: Wait for the back-end to be ready
        run: timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:8000/api/schema/; do sleep 2; done'

      - name: Run tests (unit + integration)
        run: npm run test:ci
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1

      - name: Dump back-end logs
        if: failure()
        run: docker logs meteo-backend

      - name: Stop the back-end
        if: always()
        run: docker rm -f meteo-backend

  docker:
    runs-on: ubuntu-latest
    needs: [build, run-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image tags
        id: tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          image="${DOCKER_USERNAME:-local}/${IMAGE_NAME}"
          {
            echo "list<<EOF"
            echo "${image}:latest"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on main) the Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: ${{ steps.tags.outputs.list }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
