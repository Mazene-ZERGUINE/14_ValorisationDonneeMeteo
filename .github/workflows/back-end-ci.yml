name: Back-end CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: back-end-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: 14_valorisationdonneemeteo-backend

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      timescaledb:
        image: timescale/timescaledb:2.25.0-pg17
        env:
          POSTGRES_USER: infoclimat
          POSTGRES_PASSWORD: infoclimat2026
          POSTGRES_DB: meteodb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infoclimat -d meteodb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: django-insecure-ci-secret
      DEBUG: "false"
      ALLOWED_HOSTS: "*"
      MOCKED_DATA: "false"
      DB_NAME: meteodb
      DB_USER: infoclimat
      DB_PASSWORD: infoclimat2026
      DB_HOST: localhost
      DB_PORT: "5432"
      COVERAGE_THRESHOLD: "70"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: uv run ruff check --output-format=github .


      - name: Run tests (unit + integration) with coverage
        run: |
          uv run pytest \
            --cov \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Publish coverage to the job summary
        run: |
          uv run python - <<'PY'
          import contextlib, json, os

          threshold = float(os.environ["COVERAGE_THRESHOLD"])
          with open("coverage.json") as fh:
              data = json.load(fh)

          total = data["totals"]["percent_covered"]
          ok = total >= threshold

          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          with summary, contextlib.redirect_stdout(summary):
              print(f"## Back-end coverage {'✅' if ok else '⚠️'} {total:.2f}%")
              print(f"_Target: {threshold:.0f}% (informational, does not fail the build)_\n")
              print(
                  "📥 The full HTML report is attached to this run as the "
                  "**backend-coverage-html** artifact — download it and open "
                  "`index.html`.\n"
              )

              rows = sorted(
                  data["files"].items(),
                  key=lambda kv: kv[1]["summary"]["percent_covered"],
              )
              below = [r for r in rows if r[1]["summary"]["percent_covered"] < 100]

              if not below:
                  print("Every file is fully covered.")
              else:
                  print("| File | Statements | Missing | Coverage |")
                  print("| --- | ---: | ---: | ---: |")
                  for path, info in below[:30]:
                      s = info["summary"]
                      print(
                          f"| `{path}` | {s['num_statements']} "
                          f"| {s['missing_lines']} "
                          f"| {s['percent_covered']:.2f}% |"
                      )
                  if len(below) > 30:
                      print(f"\n_{len(below) - 30} more files omitted._")

          if not ok:
              print(
                  f"::warning title=Back-end coverage::Coverage {total:.2f}% "
                  f"is below the {threshold:.0f}% target."
              )
          PY

      - name: Upload the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.json
            backend/coverage.xml
          if-no-files-found: warn


      - name: Upload the HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: backend/htmlcov/
          if-no-files-found: warn
          retention-days: 14

  docker-push:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image tags
        id: tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          image="${DOCKER_USERNAME:-local}/${IMAGE_NAME}"
          {
            echo "list<<EOF"
            echo "${image}:latest"
            echo "${image}:${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on main) the Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ steps.tags.outputs.list }}
          push: ${{ env.PUSH_IMAGE == 'true' }}
          load: ${{ env.PUSH_IMAGE != 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
