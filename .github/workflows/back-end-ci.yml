name: Back-end CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: back-end-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: 14_valorisationdonneemeteo-backend

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      timescaledb:
        image: timescale/timescaledb:2.25.0-pg17
        env:
          POSTGRES_USER: infoclimat
          POSTGRES_PASSWORD: infoclimat2026
          POSTGRES_DB: meteodb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infoclimat -d meteodb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: django-insecure-ci-secret
      DEBUG: "false"
      ALLOWED_HOSTS: "*"
      MOCKED_DATA: "false"
      DB_NAME: meteodb
      DB_USER: infoclimat
      DB_PASSWORD: infoclimat2026
      DB_HOST: localhost
      DB_PORT: "5432"
      COVERAGE_THRESHOLD: "70"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run linter
        run: uv run ruff check --output-format=github .


      - name: Run tests (unit + integration) with coverage
        run: |
          uv run pytest \
            --cov \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:coverage.json \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Publish coverage to the job summary
        run: uv run python "$GITHUB_WORKSPACE/.github/workflows/scripts/backend-coverage-summary.py"

  docker-push:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    env:
      PUSH_IMAGE: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and push on main) the Docker image
        uses: docker/build-push-action@v6
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          context: ./backend
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          push: ${{ env.PUSH_IMAGE == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
