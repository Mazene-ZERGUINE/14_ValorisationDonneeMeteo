name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TRIVY_NO_PROGRESS: "true"
  TRIVY_TIMEOUT: "15m"

jobs:
  scan:
    name: scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          tags: meteo-${{ matrix.component }}:scan
          load: true
          cache-from: type=gha,scope=${{ matrix.component }}-security
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-security

      - name: Scan
        run: |
          trivy image --scanners vuln,secret \
            --format json --output results.json \
            meteo-${{ matrix.component }}:scan

      - name: Publish the report
        run: |
          {
            echo "## Security scan"
            echo
            echo '```'
            trivy convert --format table results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce the gate
        run: |
          trivy convert --exit-code 1 --severity CRITICAL --ignore-unfixed results.json
